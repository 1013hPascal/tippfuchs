<!--
  Tippfuchs – Einbindungscode für Blogspot
  =========================================
  Diesen Code einmalig in den HTML-Editor der Blogspot-Seite einfügen:
  Blogspot > Seiten > Tippfuchs > HTML-Ansicht
-->
<div id="tippfuchs-container"></div>
<script>
(function() {
  var basis = 'https://1013hpascal.github.io/tippfuchs/';
  var params = new URLSearchParams(window.location.search);
  var beitretenCode = params.get('beitreten');
  var src = beitretenCode ? basis + '?beitreten=' + encodeURIComponent(beitretenCode) : basis;
  var frame = document.createElement('iframe');
  frame.src = src;
  frame.title = 'Tippfuchs Wortraetsel';
  frame.style.cssText = 'width:100%;height:100vh;border:none;display:block;';
  frame.setAttribute('allowfullscreen', '');
  document.getElementById('tippfuchs-container').appendChild(frame);
})();
</script>
