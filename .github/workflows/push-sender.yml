name: Tippfuchs Push-Sender

on:
  schedule:
    # Jede volle Stunde (UTC) — entspricht deutschen Zeiten 06-22 Uhr
    - cron: '0 4-20 * * *'
  workflow_dispatch:  # Manuell auslösbar zum Testen

jobs:
  push-senden:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install firebase-admin pytz

      - name: Push-Sender ausführen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python push-sender.py
